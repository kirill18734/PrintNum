<!doctype html>
<!-- Popup interface for service status and extension feature settings. -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/status.css" />
    <link rel="stylesheet" href="css/components.css" />
    <title>PrintNum</title>
  </head>
  <body>
    <!-- БЛОК СТАТУСА ПЕЧАТИ -->
    <div id="statusCard" class="status-card inactive">
      <div class="indicator"></div>
      <div class="status-info">
        <span id="statusTitle" class="status-title">Печать не активна</span>
        <span id="statusDesc">
          Проверьте, что приложение PrintNum запущено или
          <button id="downloadBtn" class="download-btn">
            скачайте PrintNum
          </button>
        </span>
      </div>
    </div>

    <!-- ОСНОВНОЙ АККОРДЕОН -->
    <details class="main-accordion">
      <summary>Дополнительные возможности</summary>
      <div class="accordion-content">
        <!-- 1. QR-коды -->
        <details class="sub-accordion" id="qrCodes">
          <summary>
            <span>Обработчики QR-кодов</span>
            <!-- Кнопка принтера с SVG-иконкой внутри summary -->
            <button
              id="print-pdf"
              class="icon-print-btn"
              title="Печать PDF"
              type="button"
            >
              <svg
                xmlns="http://w3.org"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                <path
                  d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"
                ></path>
                <rect x="6" y="14" width="12" height="8"></rect>
              </svg>
            </button>
          </summary>
          <div class="sub-content">
            <button class="global-toggle-btn"></button>
            <div class="buttons-list"></div>
          </div>
        </details>

        <!-- 2. Автоскрипты -->
        <details class="sub-accordion" id="autoscripts">
          <summary>Автоскрипты</summary>
          <div class="sub-content">
            <button class="global-toggle-btn"></button>
            <div class="buttons-list"></div>
          </div>
        </details>

        <!-- БЛОК: Настройка видимости -->
        <div class="visibility-settings">
          <h3 class="settings-title">Настройка видимости</h3>

          <!-- 3. Меню -->
          <details class="sub-accordion" id="menu">
            <summary>Меню</summary>
            <div class="sub-content">
              <button class="global-toggle-btn"></button>
              <div class="buttons-list"></div>
            </div>
          </details>

          <!-- 4. Уведомления -->
          <details class="sub-accordion" id="notification">
            <summary>Уведомления</summary>
            <div class="sub-content">
              <button class="global-toggle-btn"></button>
              <div class="buttons-list"></div>
            </div>
          </details>

          <!-- 5. Возвраты -->
          <details class="sub-accordion" id="returns">
            <summary>Возвраты</summary>
            <div class="sub-content">
              <button class="global-toggle-btn"></button>
              <div class="buttons-list"></div>
            </div>
          </details>

          <!-- 6. Баннеры -->
          <details class="sub-accordion" id="banners">
            <summary>Баннеры</summary>
            <div class="sub-content">
              <button class="global-toggle-btn"></button>
              <div class="buttons-list"></div>
            </div>
          </details>
        </div>
      </div>
    </details>

    <!-- БЛОК ССЫЛОК И ПОДДЕРЖКИ -->
    <div class="footer-links">
      <!-- Кнопка Telegram -->
      <button
        id="btn-telegram"
        class="footer-btn tg-btn group"
        title="Поддержка в Telegram"
        type="button"
      >
        <svg
          class="icon-svg tg-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        <div class="tg-text-container">
          <span class="tg-text-static">Поддержка</span>
          <span class="tg-text-hover">@printnum</span>
        </div>
      </button>

      <!-- Кнопка GitHub -->
      <button
        id="btn-github"
        class="footer-btn gh-btn"
        title="Документация на GitHub"
        type="button"
      >
        <svg
          class="icon-svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
          ></path>
        </svg>
        <span class="truncate">Документация</span>
      </button>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/status.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
